<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="site-header">
	<div class="site-header__inner">
		<a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

		<button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
			<span></span><span></span>
		</button>

		<nav class="site-nav" id="primary-nav" aria-label="Primary">
			<ul class="menu">
				{% for item in site.data.menu %}
				{% assign active = false %}
				{% if page.url == item.url or page.index_url == item.url %}{% assign active = true %}{% endif %}
				<li><a href="{{ item.url | relative_url }}"{% if active %} class="is-active" aria-current="page"{% endif %}>{{ item.title }}</a></li>
				{% endfor %}
			</ul>
		</nav>
	</div>
</header>
