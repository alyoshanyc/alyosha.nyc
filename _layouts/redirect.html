{% comment %} Forwards an old address to its new page (front matter
   `redirect_to:`), for example /contact/ to /about/. {% endcomment %}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>{{ site.title }}</title>
	<link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
	<meta name="robots" content="noindex">
	<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body>
	<p><a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_to | absolute_url }}</a></p>
</body>
</html>
