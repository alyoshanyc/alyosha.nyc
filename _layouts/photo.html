---
layout: default
---
{% comment %} Dedicated page for one photo (generated by _plugins/photo_pages.rb).
   The image fits the viewport uncropped; prev/next follow the stream order. {% endcomment %}
<article class="photo">
	<figure class="photo__media">
		<img class="photo__img" src="{{ page.image | relative_url }}" alt="">
	</figure>
	<nav class="photo__nav" aria-label="Photo navigation">
		{% if page.prev_url %}<a class="photo__arrow" href="{{ page.prev_url | relative_url }}" aria-label="Previous photo">&larr;</a>{% else %}<span class="photo__arrow photo__arrow--off">&larr;</span>{% endif %}
		<a class="photo__index" href="{{ '/' | relative_url }}">Index</a>
		{% if page.next_url %}<a class="photo__arrow" href="{{ page.next_url | relative_url }}" aria-label="Next photo">&rarr;</a>{% else %}<span class="photo__arrow photo__arrow--off">&rarr;</span>{% endif %}
	</nav>
</article>
